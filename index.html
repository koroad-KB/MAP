<script>
let currentInfoWindow = null;  
let signalData = [];
let noticeOnly = false;
const noticeFilterButton = document.getElementById("noticeFilterBtn");
function hasNotice(item) {
    return String(item.notice ?? "").trim().length > 0;
}
function refreshNoticeFilterLabel() {
    const count = signalData.filter(hasNotice).length;
    noticeFilterButton.textContent = noticeOnly
        ? `🔔 알림 장비 ${count}개 · 전체 보기`
        : `🔔 알림 등록 장비만 보기 (${count})`;
    noticeFilterButton.classList.toggle("active", noticeOnly);
    noticeFilterButton.setAttribute("aria-pressed", String(noticeOnly));
}
function applyNoticeFilter() {
    if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
    renderDevices(noticeOnly ? signalData.filter(hasNotice) : signalData);
    refreshNoticeFilterLabel();
}
noticeFilterButton.addEventListener("click", function() {
    noticeOnly = !noticeOnly;
    applyNoticeFilter(); // 지도 중심과 확대 수준은 유지
});

let markers = [];
let overlays = [];
let zoomPins = [];
let clusterer = null;
  let selectedGroup = null;
  

let clickMarker = null;
let clickLat = "";
let clickLng = "";
let coordMode = false;
  
const map = new kakao.maps.Map(
    document.getElementById("map"),
    {
        center: new kakao.maps.LatLng(37.4563, 126.7052),
        level: 8
    }
);
kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
    if(currentInfoWindow){
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
  if(!coordMode){
    return;
}
coordMode = false;

document.getElementById("coordBtn").style.background="white";
document.getElementById("coordBtn").innerHTML="📍";
document.getElementById("copyBtn").style.display="block";

    clickLat = latlng.getLat().toFixed(6);
    clickLng = latlng.getLng().toFixed(6);
  
      document.getElementById("coordBox").innerHTML =
        "위도 : " + clickLat +
        "<br>경도 : " + clickLng;
  document.getElementById("coordBox").style.display = "block";

    if(clickMarker){
        clickMarker.setMap(null);

    clickMarker = new kakao.maps.Marker({

});

// 알림사항 편집 모달: 기존 장비번호 기준으로 M열을 갱신합니다.
const NOTICE_API_URL = "https://script.google.com/macros/s/AKfycbzMeyb7sYJkuTEaSFoq3PQG6lhgDh-2iBxqUE1UUU55dLePBkkX3BwVnKC0GGocEOvmIA/exec";
function updateNoticeViaJsonp(code, notice, expected) {
    return new Promise((resolve, reject) => {
        const callback = "noticeCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
        const script = document.createElement("script");
        let settled = false;
        const finish = (error, data) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            script.remove();
            delete window[callback];
            error ? reject(error) : resolve(data);
        };
        window[callback] = data => finish(null, data);
        const params = new URLSearchParams({action:"updateNotice", code:String(code), notice, expected, callback, _:String(Date.now())});
        script.src = NOTICE_API_URL + "?" + params.toString();
        script.onerror = () => finish(new Error("서버 연결에 실패했습니다."));
        const timer = setTimeout(() => finish(new Error("저장 응답 시간이 초과되었습니다.")), 20000);
        document.head.appendChild(script);
    });
}

// 사진은 장비 상세정보의 [사진] 버튼을 눌렀을 때만 조회합니다.
function photoJsonp(params) {
    return new Promise((resolve,reject)=>{
        const cb="photoCb_"+Date.now()+"_"+Math.floor(Math.random()*1e7);
        const script=document.createElement("script");
        let done=false;
        const finish=(err,value)=>{
            if(done)return;done=true;clearTimeout(timer);script.remove();delete window[cb];
            err?reject(err):resolve(value);
        };
        window[cb]=data=>finish(null,data);
        script.onerror=()=>finish(new Error("사진 서버 연결 실패"));
        const timer=setTimeout(()=>finish(new Error("사진 조회 시간 초과")),25000);
        script.src=NOTICE_API_URL+"?"+new URLSearchParams({...params,callback:cb,_:Date.now()});
        document.head.appendChild(script);
    });
}
async function compressPhoto(file) {
    if(!file.type.startsWith("image/")) throw new Error("이미지 파일을 선택하세요.");
    const bitmap=await createImageBitmap(file);
    const max=1280,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
    bitmap.close();
    for(const quality of [.8,.65,.5,.35,.22]) {
        const url=canvas.toDataURL("image/jpeg",quality);
        if(url.length<600000) return url.split(",")[1];
    }
    throw new Error("사진 용량이 큽니다. 작은 사진을 선택해 주세요.");
}
function openPhotoPanel(item) {
    if(document.getElementById("photoBackdrop"))return;
    const backdrop=document.createElement("div");
    backdrop.id="photoBackdrop";
    backdrop.style.cssText="position:fixed;inset:0;background:#0009;z-index:100000;display:flex;justify-content:center;align-items:center;padding:12px;box-sizing:border-box;";
    const panel=document.createElement("div");
    panel.style.cssText="background:#fff;border-radius:12px;padding:16px;width:min(100%,480px);max-height:88vh;overflow:auto;box-sizing:border-box;";
    const title=document.createElement("h3");title.textContent="📷 현장사진 · "+String(item.code||"");title.style.margin="0 0 12px";
    const status=document.createElement("div");status.style.cssText="font-size:13px;color:#555;margin:8px 0;";
    const gallery=document.createElement("div");gallery.style.cssText="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;";
    const input=document.createElement("input");input.type="file";input.accept="image/*";input.multiple=true;input.style.maxWidth="100%";
    const upload=document.createElement("button");upload.textContent="선택한 사진 올리기";
    const close=document.createElement("button");close.textContent="닫기";
    for(const b of [upload,close])b.style.cssText="padding:9px;border:1px solid #aaa;border-radius:6px;background:#fff;margin:8px 5px 5px 0;";
    close.onclick=()=>backdrop.remove();
    // 이미 조회한 이미지는 다시 다운로드하지 않고 전체화면으로 확대합니다.
    function showPhotoFullscreen(src, name) {
        if(document.getElementById("photoFullscreen"))return;
        const viewer=document.createElement("div");
        viewer.id="photoFullscreen";
        viewer.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200000;display:flex;align-items:center;justify-content:center;padding:52px 12px 22px;box-sizing:border-box;";
        const image=document.createElement("img");
        image.src=src;
        image.alt=name;
        image.style.cssText="max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom;";
        const exit=document.createElement("button");
        exit.type="button";
        exit.textContent="✕ 닫기";
        exit.setAttribute("aria-label","사진 크게 보기 닫기");
        exit.style.cssText="position:absolute;top:12px;right:12px;padding:9px 14px;border:1px solid #aaa;border-radius:8px;background:white;color:#111;font-size:16px;font-weight:bold;cursor:pointer;";
        const dismiss=()=>{viewer.remove();document.removeEventListener("keydown",onKey);};
        const onKey=ev=>{if(ev.key==="Escape")dismiss();};
        exit.onclick=dismiss;
        viewer.onclick=ev=>{if(ev.target===viewer)dismiss();};
        document.addEventListener("keydown",onKey);
        viewer.append(image,exit);
        document.body.appendChild(viewer);
    }
    async function refresh() {
        status.textContent="사진 목록 불러오는 중…";gallery.replaceChildren();
        try {
            const result=await photoJsonp({action:"listPhotos",code:String(item.code)});
            if(!result.ok)throw new Error(result.error||"조회 실패");
            status.textContent=result.photos.length+"장 등록됨 · 사진을 눌러 열기";
            for(const photo of result.photos) {
                const card=document.createElement("div");
                card.style.cssText="border:1px solid #ddd;border-radius:7px;padding:8px;background:#f7f7f7;min-width:0;";
                const b=document.createElement("button");
                b.type="button";
                b.style.cssText="width:100%;border:0;background:transparent;text-align:left;min-height:55px;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer;";
                b.textContent="📷 "+photo.date+"\n"+photo.name;
                let cachedPhotoSrc=null;
                b.onclick=async()=>{
                    // 두 번째 클릭부터는 서버 재조회 없이 저장된 사진을 크게 보여줍니다.
                    if(cachedPhotoSrc){showPhotoFullscreen(cachedPhotoSrc,photo.name);return;}
                    b.disabled=true;b.textContent="사진 불러오는 중…";
                    try {
                        const r=await photoJsonp({action:"getPhoto",code:String(item.code),id:photo.id});
                        if(!r.ok)throw new Error(r.error||"사진 열기 실패");
                        cachedPhotoSrc="data:image/jpeg;base64,"+r.data;
                        const img=document.createElement("img");img.src=cachedPhotoSrc;
                        img.alt=photo.name;img.style.cssText="width:100%;height:auto;border-radius:5px;cursor:zoom-in;";
                        b.title="사진을 다시 누르면 크게 볼 수 있습니다";
                        b.replaceChildren(img);
                    } catch(e){b.textContent="사진 오류: "+e.message;}
                    finally{b.disabled=false;}
                };
                const del=document.createElement("button");
                del.type="button";
                del.textContent="🗑️ 삭제";
                del.style.cssText="width:100%;margin-top:7px;padding:7px;border:1px solid #c62828;border-radius:6px;color:#b71c1c;background:white;font-weight:bold;cursor:pointer;";
                del.onclick=async()=>{
                    if(!confirm("이 사진을 삭제하시겠습니까?\nGoogle Drive 휴지통으로 이동하며 사진 목록에서 제거됩니다.\n\n"+photo.name))return;
                    del.disabled=true;b.disabled=true;
                    status.textContent="사진 삭제 요청 중…";
                    try {
                        await fetch(NOTICE_API_URL,{
                            method:"POST",mode:"no-cors",
                            headers:{"Content-Type":"text/plain;charset=utf-8"},
                            body:JSON.stringify({action:"deletePhoto",code:String(item.code),id:photo.id})
                        });
                        let removed=false;
                        for(let attempt=0;attempt<8;attempt++){
                            await new Promise(r=>setTimeout(r,1200+attempt*350));
                            const res=await photoJsonp({action:"listPhotos",code:String(item.code)});
                            if(!res.ok)throw new Error(res.error||"목록 확인 실패");
                            if(!res.photos.some(p=>p.id===photo.id)){removed=true;break;}
                        }
                        if(!removed)throw new Error("삭제 확인 실패. 사진오류로그 시트와 배포 버전을 확인해 주세요.");
                        await refresh();
                    }catch(err){
                        status.textContent="삭제 실패: "+err.message;
                        del.disabled=false;b.disabled=false;
                    }
                };
                card.append(b,del);
                gallery.appendChild(card);
            }
        } catch(e){status.textContent="조회 실패: "+e.message;}
    }
    upload.onclick=async()=>{
        const files=Array.from(input.files||[]);
        if(!files.length){alert("사진을 선택하세요.");return;}
        upload.disabled=true;
        try {
            for(let i=0;i<files.length;i++){
                status.textContent=`사진 ${i+1}/${files.length} 압축·업로드 중…`;
                const data=await compressPhoto(files[i]);
                const token="photo_"+Date.now()+"_"+Math.random().toString(36).slice(2);
                // no-cors 응답은 읽을 수 없으므로 저장 여부는 별도 조회로 확인
                await fetch(NOTICE_API_URL,{method:"POST",mode:"no-cors",
                    headers:{"Content-Type":"text/plain;charset=utf-8"},
                    body:JSON.stringify({action:"uploadPhoto",code:String(item.code),token,data})});
                let found=false;
                for(let attempt=0;attempt<8;attempt++){
                    await new Promise(r=>setTimeout(r,1200+attempt*350));
                    const res=await photoJsonp({action:"listPhotos",code:String(item.code)});
                    if(res.ok && res.photos.some(p=>p.token===token)){found=true;break;}
                }
                if(!found)throw new Error("업로드 확인 실패. Drive 폴더 ID, 배포 권한 또는 네트워크를 확인하세요.");
            }
            input.value="";await refresh();alert("사진 업로드가 완료되었습니다.");
        } catch(e){status.textContent="업로드 실패: "+e.message;}
        finally{upload.disabled=false;}
    };
    panel.append(title,input,upload,close,status,gallery);
    backdrop.appendChild(panel);document.body.appendChild(backdrop);
    refresh();
}

function openNoticeEditor(item, onSaved) {
    if (document.getElementById("noticeEditorBackdrop")) return;
    const backdrop = document.createElement("div");
    backdrop.id = "noticeEditorBackdrop";
    backdrop.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;";
    const panel = document.createElement("div");
    panel.style.cssText = "background:white;border-radius:12px;padding:18px;width:min(100%,440px);box-sizing:border-box;box-shadow:0 10px 35px #0004;";
    const heading = document.createElement("div");
    heading.textContent = "📢 알림사항 · " + String(item.code || "장비");
    heading.style.cssText = "font-size:17px;font-weight:bold;margin-bottom:10px;";
    const textarea = document.createElement("textarea");
    textarea.value = String(item.notice || "");
    textarea.maxLength = 1000;
    textarea.placeholder = "예: 26.10.15. 현장 정밀점검 중 장비 단속속도 상향(50 → 60) 확인";
    textarea.style.cssText = "width:100%;height:180px;box-sizing:border-box;padding:10px;font-size:15px;line-height:1.5;border:1px solid #aaa;border-radius:7px;resize:vertical;";
    const help = document.createElement("div");
    help.textContent = "여러 건은 줄을 바꿔 입력하세요. 저장하면 구글 시트 M열에 반영됩니다.";
    help.style.cssText = "font-size:12px;color:#666;margin:6px 0 12px;";
    const buttons = document.createElement("div");
    buttons.style.cssText = "display:flex;gap:8px;justify-content:flex-end;";
    const cancel = document.createElement("button");
    cancel.textContent = "취소";
    const save = document.createElement("button");
    save.textContent = "저장";
    [cancel,save].forEach(btn => btn.style.cssText = "padding:9px 17px;border:0;border-radius:6px;font-size:14px;cursor:pointer;");
    save.style.background = "#1565c0";
    save.style.color = "white";
    cancel.onclick = () => backdrop.remove();
    save.onclick = async () => {
        const newText = textarea.value.trim();
        if (newText === String(item.notice || "").trim()) { backdrop.remove(); return; }
        if (!confirm(newText ? "알림사항을 구글 시트에 저장할까요?" : "알림사항을 비우시겠습니까?")) return;
        save.disabled = true; save.textContent = "저장 중…";
        try {
            const result = await updateNoticeViaJsonp(item.code, newText, String(item.notice || ""));
            if (!result || !result.ok) throw new Error(result?.error || "저장되지 않았습니다.");
            item.notice = result.notice;
            onSaved();
            if (noticeOnly) applyNoticeFilter();
            else refreshNoticeFilterLabel();
            backdrop.remove();
            alert("알림사항이 구글 시트에 저장되었습니다.");
        } catch (err) {
            alert("저장 실패: " + err.message + "\n시트 배포 및 네트워크 상태를 확인하세요.");
        } finally { save.disabled = false; save.textContent = "저장"; }
    };
    buttons.append(cancel,save);
    panel.append(heading,textarea,help,buttons);
    backdrop.appendChild(panel);
    document.body.appendChild(backdrop);
    textarea.focus();
}

// 구글 스프레드시트에서 장비 데이터를 불러옵니다.
function renderDevices(data) {
    // 기존 지도 객체를 정리해 중복 표시를 방지합니다.
    if (clusterer) {
        clusterer.clear();
        clusterer.setMap(null);

let myLocationMarker = null;


// ========================================
// 신호기 이름 표시 여부
// 5단계 이상 → 이름 숨김
// 4단계 이하 → 이름 표시
// ========================================

function updateOverlayVisible(){
    const level = map.getLevel();

    // 검색한 장비/신호군뿐 아니라 주변의 다른 장비도 계속 표시합니다.
    // 전체 모드: 5~6단계 핀, 7단계 이상 숫자 클러스터
    // 알림 필터 모드도 동일: 5~6단계 핀, 7단계 이상 숫자 클러스터
    overlays.forEach(function(overlay){
        if (level <= 4) {
            overlay.setMap(map);
        } else {
            overlay.setMap(null);
        }
    });

    zoomPins.forEach(function(pin){
        if (level >= 5 && level <= 6) {
            pin.setMap(map);
        } else {
            pin.setMap(null);
        }
    });
}
  
// 실시간 GPS 추적: 버튼을 누르면 시작, 다시 누르면 종료합니다.
let gpsWatchId = null;
let gpsFollowing = false;
let gpsAccuracyCircle = null;
let gpsStarted = false;
const gpsButton = document.getElementById("gpsBtn");
gpsButton.title = "실시간 위치 추적 시작";
gpsButton.setAttribute("aria-label", "실시간 위치 추적 시작");

function gpsTargetIcon(color) {
    return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="9" stroke="${color}" stroke-width="2.4"/>
      <circle cx="16" cy="16" r="3.2" fill="${color}"/>
      <path d="M16 2.5v7 M16 22.5v7 M2.5 16h7 M22.5 16h7" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>
    </svg>`;
}
function setGpsButton(active, loading = false) {
    const pausedFollow = active && !gpsFollowing;
    const color = loading ? "#1976D2" : pausedFollow ? "#E58A13" : active ? "#1976D2" : "#687681";
    gpsButton.style.background = active ? "#EAF3FF" : "white";
    gpsButton.classList.toggle("gps-loading", loading);
    gpsButton.innerHTML = gpsTargetIcon(color);
    gpsButton.title = loading ? "GPS 위치 확인 중" : active ? (pausedFollow ? "위치 추적 중 · 지도 따라가기 해제 (누르면 추적 종료)" : "실시간 위치 추적 종료") : "실시간 위치 추적 시작";
    gpsButton.setAttribute("aria-label", gpsButton.title);
    gpsButton.setAttribute("aria-pressed", String(active));
}
setGpsButton(false);

function stopGpsTracking() {
    if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
    }
    gpsFollowing = false;
    gpsStarted = false;
    setGpsButton(false);
    // 마지막 위치 마커는 남겨 두어 현장 위치를 계속 확인할 수 있습니다.
}

// 사용자가 직접 지도를 움직이면 자동 중심 이동만 중지합니다.
// 위치 마커는 계속 갱신되며, 다시 따라가려면 추적을 껐다 켭니다.
kakao.maps.event.addListener(map, "dragstart", function() {
    if (gpsWatchId !== null) { gpsFollowing = false; setGpsButton(true); }
});

gpsButton.onclick = function() {
    if (gpsWatchId !== null) {
        stopGpsTracking();
        return;
    }
    if (!navigator.geolocation) {
        alert("이 브라우저에서는 현재 위치를 사용할 수 없습니다.");
        return;
    }
    gpsFollowing = true;
    gpsStarted = false;
    setGpsButton(false, true);
    gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
            const loc = new kakao.maps.LatLng(lat, lng);
            if (!myLocationMarker) {
                const dot = document.createElement("div");
                dot.style.cssText = "width:17px;height:17px;background:#1976D2;border:3px solid white;border-radius:50%;box-shadow:0 0 0 2px #1976D2,0 2px 8px #555;box-sizing:content-box;";
                myLocationMarker = new kakao.maps.CustomOverlay({
                    map: map, position: loc, content: dot, xAnchor: 0.5, yAnchor: 0.5, zIndex: 100
                });
            } else {
                myLocationMarker.setPosition(loc);
                myLocationMarker.setMap(map);
            }
            const accuracy = Number(position.coords.accuracy);
            if (Number.isFinite(accuracy) && accuracy > 0) {
                if (!gpsAccuracyCircle) {
                    gpsAccuracyCircle = new kakao.maps.Circle({
                        map: map, center: loc, radius: accuracy,
                        strokeWeight: 1, strokeColor: "#1976D2", strokeOpacity: 0.45,
                        fillColor: "#1976D2", fillOpacity: 0.08, zIndex: 1
                    });
                } else {
                    gpsAccuracyCircle.setPosition(loc);
                    gpsAccuracyCircle.setRadius(accuracy);
                    gpsAccuracyCircle.setMap(map);
                }
            }
            if (gpsFollowing) {
                map.setCenter(loc);
                if (!gpsStarted) map.setLevel(3);
            }
            gpsStarted = true;
            setGpsButton(true);
        },
        function(error) {
            stopGpsTracking();
            const message = error.code === 1 ? "위치 권한이 차단되었습니다. 브라우저 위치 권한을 허용해 주세요." :
                            error.code === 2 ? "현재 위치를 확인할 수 없습니다. GPS 및 네트워크 상태를 확인해 주세요." :
                            error.code === 3 ? "GPS 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요." :
                            "위치 정보를 확인할 수 없습니다.";
            alert(message);
        },
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 3000 }
    );
};
document.getElementById("searchBtn").onclick = function(){
    // 검색 시 숨겨진 장비도 검색할 수 있도록 알림 필터 해제
    if (noticeOnly) {
        noticeOnly = false;
        applyNoticeFilter();
    }

    const searchBox = document.getElementById("searchBox");
    const keyword = searchBox.value.trim();

    if(keyword === ""){
        searchBox.blur();
        return;
    }


    // =========================================
    // ① 신호군 검색
    // 예 : 996G
    // =========================================

    const groupResults = signalData.filter(function(item){

        return String(item.group || "")
            .trim()
            .toUpperCase() === keyword.toUpperCase();

    });


    if(groupResults.length > 0){

        // 신호군을 검색해도 다른 인근 장비를 숨기지 않습니다.
        selectedGroup = null;

        if(clusterer){
            clusterer.clear();
        }

        markers.forEach(function(marker){
            marker.setMap(null);
        });
        markers.forEach(function(marker){
            marker.setMap(map);
        });

        // 모든 장비를 클러스터링 상태로 유지
        if(clusterer){
            clusterer.addMarkers(markers);
        }

        // 현재 확대 단계에 맞춰 전체 장비명/핀을 표시
        updateOverlayVisible();

        // 검색한 신호군이 있는 위치로 이동하되, 주변 장비도 계속 표시
        const bounds = new kakao.maps.LatLngBounds();
        groupResults.forEach(function(item){
            bounds.extend(new kakao.maps.LatLng(Number(item.lat), Number(item.lng)));
        });
        map.setBounds(bounds);

        setTimeout(function(){
            if(map.getLevel() > 6){
                map.setLevel(6);
            }
            updateOverlayVisible();
        }, 100);

        searchBox.value = "";
        searchBox.blur();
        return;
    }


    // =========================================
    // ② 일반 신호기 검색
    // 예 : 4005
    // =========================================

    const item = signalData.find(function(x){

        return (

            String(x.code || "")
                .trim()
                .includes(keyword) ||

            String(x.name || "")
                .trim()
                .includes(keyword)

        );

    });


    if(item){

        // 검색 상태 해제
        selectedGroup = null;

        if(clusterer){
            clusterer.clear();
        }


        // 모든 마커 표시
        markers.forEach(function(marker){
            marker.setMap(map);
        });


        // 전체 클러스터링
        if(clusterer){
            clusterer.addMarkers(markers);
        }


        // 이름 표시
        updateOverlayVisible();


        // 검색된 신호기로 이동
        const position = new kakao.maps.LatLng(
            Number(item.lat),
            Number(item.lng)
        );

        // 검색한 장비를 지도 중앙에 놓고 최대 확대(카카오 지도 레벨 1)
        // 확대와 중심 이동을 함께 지정하고, 지도 이동 애니메이션 이후 중앙을 한 번 더 맞춥니다.
        map.setLevel(1, { anchor: position });
        map.setCenter(position);
        setTimeout(function(){
            map.setCenter(position);
            map.setLevel(1);
            updateOverlayVisible();
        }, 250);

        searchBox.value = "";
        searchBox.blur();

        return;
    }



    // =========================================
    // ③ 여기부터 주소 / 지번 / 장소 검색
    // =========================================

    // 신호군 / 신호기 검색이 아니므로
    // 전체 상태로 변경
    selectedGroup = null;


    if(clusterer){
        clusterer.clear();
    }


    // 모든 신호기 표시
    markers.forEach(function(marker){
        marker.setMap(map);
    });


    if(clusterer){
        clusterer.addMarkers(markers);
    }


    updateOverlayVisible();



    // =========================================
    // ④ 주소 검색 객체
    // =========================================

    const geocoder = new kakao.maps.services.Geocoder();


    // =========================================
    // ⑤ 먼저 주소 검색
    // 도로명주소 / 지번주소
    // =========================================

    geocoder.addressSearch(
        keyword,

        function(result, status){

            if(status === kakao.maps.services.Status.OK){

                const lat = Number(result[0].y);
                const lng = Number(result[0].x);

                const position =
                    new kakao.maps.LatLng(lat, lng);


                // 지도 이동
                map.setCenter(position);

                // 주소 검색은 조금 확대
                map.setLevel(4);


                // 검색 위치 표시
                showSearchMarker(
                    position,
                    keyword
                );


                searchBox.value = "";
                searchBox.blur();

                return;
            }


            // =====================================
            // ⑥ 주소 검색 실패
            // → 장소 검색으로 넘어감
            // =====================================

            const places =
                new kakao.maps.services.Places();


            places.keywordSearch(
                keyword,

                function(result, status){

                    if(
                        status ===
                        kakao.maps.services.Status.OK
                    ){

                        const place = result[0];

                        const position =
                            new kakao.maps.LatLng(
                                Number(place.y),
                                Number(place.x)
                            );


                        // 지도 이동
                        map.setCenter(position);

                        map.setLevel(4);


                        // 검색 위치 표시
                        showSearchMarker(
                            position,
                            place.place_name
                        );


                        searchBox.value = "";
                        searchBox.blur();

                        return;

                    }


                    // =================================
                    // ⑦ 전부 검색 실패
                    // =================================

                    alert(
                        "검색 결과가 없습니다.\n\n" +
                        "신호기 번호, 신호군, 주소,\n" +
                        "지번 또는 장소명을 입력해 주세요."
                    );

                    searchBox.blur();

                }

            );

        }

    );

};
let searchMarker = null;
let searchInfoWindow = null;

function showSearchMarker(position, title){

    // 기존 검색 마커 제거
    if(searchMarker){
        searchMarker.setMap(null);
    }

    // 기존 검색 인포윈도우 제거
    if(searchInfoWindow){
        searchInfoWindow.close();
    }

    // 검색 위치 마커
    searchMarker = new kakao.maps.Marker({
        map: map,
        position: position
    });

    // 검색 결과 정보창
    searchInfoWindow = new kakao.maps.InfoWindow({

        content:
            '<div style="' +
            'padding:8px 12px;' +
            'font-size:13px;' +
            'font-weight:bold;' +
            'white-space:nowrap;' +
            '">' +
            title +
            '</div>'

    });

    searchInfoWindow.open(
        map,
        searchMarker
    );
}



// ========================================
// 모바일 키보드 제어
// 검색창을 직접 눌렀을 때만 키보드를 열고,
// 지도 조작(터치/확대·축소) 중에는 검색창 포커스를 해제합니다.
// ========================================
const searchInput = document.getElementById("searchBox");

}

// 지도를 터치하거나 드래그하기 시작하면 키보드 닫기

mapElement.addEventListener("pointerdown", function(e){

}, { passive: true });

kakao.maps.event.addListener(map, "zoom_changed", dismissSearchKeyboard);

// ========================================
// 거리재기
// ========================================

let distanceMode = false;

let distancePoints = [];

let distanceLine = null;

let distanceMarkers = [];


// 거리 계산 함수
function getDistance(p1, p2){

    const lat1 = p1.getLat();
    const lon1 = p1.getLng();

    const lat2 = p2.getLat();
    const lon2 = p2.getLng();

    const R = 6371000;

    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R * c;
}


// 거리재기 버튼
document.getElementById("distanceBtn").onclick = function(){

    distanceMode = !distanceMode;

    if(distanceMode){

        this.style.background = "#4CAF50";
        this.innerHTML = "❌";

        distancePoints = [];

        document.getElementById("distanceBox").style.display = "block";
        document.getElementById("distanceBox").innerHTML =
            "📏 지도를 클릭하세요";

    }else{

        this.style.background = "white";
        this.innerHTML = "📏";

        clearDistance();

    }

};


// 지도 클릭 시 거리 측정
kakao.maps.event.addListener(map, "click", function(mouseEvent){

    if(!distanceMode){
        return;
    }

    const point = mouseEvent.latLng;

    distancePoints.push(point);


    // 측정 지점 표시
    const marker = new kakao.maps.Marker({
        map: map,
        position: point
    });

    distanceMarkers.push(marker);


    // 두 번째 점부터 선 표시
    if(distancePoints.length >= 2){

        if(distanceLine){
            distanceLine.setMap(null);
        }

        distanceLine = new kakao.maps.Polyline({

            map: map,

            path: distancePoints,

            strokeWeight: 4,

            strokeColor: "#1976D2",

            strokeOpacity: 0.8,

            strokeStyle: "solid"

        });


        // 전체 거리 계산
        let totalDistance = 0;

        for(let i = 1; i < distancePoints.length; i++){

            totalDistance += getDistance(
                distancePoints[i-1],
                distancePoints[i]
            );

        }


        let text;

        if(totalDistance >= 1000){

            text =
                "📏 거리 : " +
                (totalDistance / 1000).toFixed(2) +
                " km";

        }else{

            text =
                "📏 거리 : " +
                Math.round(totalDistance) +
                " m";

        }


        document.getElementById("distanceBox").innerHTML =
            text +
            "<br><span style='font-size:11px;font-weight:normal;'>지점을 계속 클릭하세요</span>";

    }else{

        document.getElementById("distanceBox").innerHTML =
            "📏 첫 번째 지점 선택<br>" +
            "<span style='font-size:11px;font-weight:normal;'>두 번째 지점을 클릭하세요</span>";

    }

});


// 거리 측정 초기화
function clearDistance(){

    distanceMode = false;

    distancePoints = [];


    if(distanceLine){

        distanceLine.setMap(null);

        distanceLine = null;

    }


    distanceMarkers.forEach(function(marker){

        marker.setMap(null);

    });

    distanceMarkers = [];


    document.getElementById("distanceBox").style.display = "none";

}
